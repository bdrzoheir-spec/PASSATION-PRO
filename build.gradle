plugins {
    id 'com.android.application' version '8.6.1'
}

android {
    namespace 'com.example.passationpro'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.passationpro"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // هنا نخبره بالمسار الصحيح الذي رأيناه في صورتك
    sourceSets {
        main {
            manifest.srcFile 'app/src/main/AndroidManifest.xml'
            java.srcDirs = ['app/src/main/java']
        }
    }
}
